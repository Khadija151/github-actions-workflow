name: Testing Workflow Variables

on:
  workflow_dispatch:

env:
  cloud: google-cloud

jobs:
  greeting_job:
    runs-on: ubuntu-latest
    env:
      GREETING: Hello
    steps:
      - name: "Say Hello Mama It's Monday"
        run: echo "$GREETING $FIRST_NAME is using $cloud!"
        env:
          FIRST_NAME: Khadija
